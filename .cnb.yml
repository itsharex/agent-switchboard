$:
  push:
    - name: 构建 Agent Switchboard Linux 安装包
      runner:
        tags: cnb:arch:amd64
        cpus: 4
      docker:
        image: ubuntu:24.04
        volumes:
          - /root/.cargo/registry:copy-on-write
          - /root/.cargo/git:copy-on-write
          - /root/.npm:copy-on-write
      stages:
        - name: 安装构建依赖
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive
            # CNB 运行器位于境内机房：apt 走腾讯镜像（失败退回阿里云）、Node 用
            # 腾讯镜像压缩包、rust 与 crates.io 走 rsproxy、npm 走 npmmirror；
            # 基础镜像没有 CA 证书包，先关闭 apt 的 TLS 校验装好 ca-certificates
            # 再恢复（apt 自身的 Release 签名与包哈希校验始终生效）。
            sed -i 's@https\?://[^ ]*archive.ubuntu.com@https://mirrors.tencent.com@; s@https\?://[^ ]*security.ubuntu.com@https://mirrors.tencent.com@' /etc/apt/sources.list.d/ubuntu.sources
            echo 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/80-retries
            printf '%s\n' 'Acquire::https::Verify-Peer "false";' 'Acquire::https::Verify-Host "false";' > /etc/apt/apt.conf.d/89-https-bootstrap
            apt-get update || {
              sed -i 's@//mirrors.tencent.com@//mirrors.aliyun.com@' /etc/apt/sources.list.d/ubuntu.sources
              apt-get update
            }
            rm -f /etc/timezone
            apt-get install -y --no-install-recommends \
              build-essential ca-certificates curl file pkg-config wget xz-utils
            rm -f /etc/apt/apt.conf.d/89-https-bootstrap
            # /etc/localtime 是运行器的只读 bind-mount（容器无 SYS_ADMIN，无法
            # 卸载或替换），tzdata 全新安装的 postinst 重写该文件必然失败，并级
            # 联拖垮 python3 与全部 -dev 包的配置。先解包原版 tzdata，禁用其中
            # 重写 /etc/localtime 的分支后再配置，dpkg 记录的仍是原版包。
            cd /tmp
            apt-get download tzdata
            dpkg --unpack tzdata_*.deb
            sed -i 's|[[:space:]]*if test "$(get_timezone)" != "$TIMEZONE"; then|if false; then|' /var/lib/dpkg/info/tzdata.postinst
            dpkg --configure tzdata
            apt-get install -y --no-install-recommends \
              libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev \
              libssl-dev libwebkit2gtk-4.1-dev libxdo-dev xdg-utils
            node_version=22.23.2
            curl -fsSL "https://mirrors.tencent.com/nodejs-release/v${node_version}/node-v${node_version}-linux-x64.tar.xz" \
              | tar -xJ -C /usr/local --strip-components=1
            node --version
            npm --version
            export RUSTUP_DIST_SERVER="https://rsproxy.cn"
            export RUSTUP_UPDATE_ROOT="https://rsproxy.cn/rustup"
            curl --proto '=https' --tlsv1.2 -sSf https://rsproxy.cn/rustup-init.sh | sh -s -- -y --profile minimal
            mkdir -p /root/.cargo
            printf '%s\n' \
              '[source.crates-io]' \
              'replace-with = "rsproxy-sparse"' \
              '[source.rsproxy-sparse]' \
              'registry = "sparse+https://rsproxy.cn/index/"' \
              > /root/.cargo/config.toml
            wget -q -O /tmp/packages-microsoft-prod.deb https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
            dpkg -i /tmp/packages-microsoft-prod.deb
            apt-get update
            apt-get install -y --no-install-recommends powershell
            pwsh --version
        - name: 安装前端依赖
          script: |
            set -e
            sed -i 's@https://registry.npmjs.org@https://registry.npmmirror.com@g' package-lock.json
            npm ci
        - name: 验证发布契约与源码
          script: |
            set -e
            export PATH="/root/.cargo/bin:$PATH"
            export RUSTUP_TOOLCHAIN=stable
            cargo test --workspace
            npm run build
        - name: 构建与汇集 Linux 安装包
          script: |
            set -e
            export PATH="/root/.cargo/bin:$PATH"
            export RUSTUP_TOOLCHAIN=stable
            # tauri 打 AppImage 时会从 GitHub 拉取打包工具；先把它们按 tauri 的
            # 缓存文件名预置到 /root/.cache/tauri（存在即跳过下载），源走 jsDelivr/
            # ghfast 加速并保留直连兜底；其余 GitHub 下载经镜像模板改写。
            export APPIMAGE_EXTRACT_AND_RUN=1
            export TAURI_BUNDLER_TOOLS_GITHUB_MIRROR_TEMPLATE="https://ghfast.top/https://github.com/<owner>/<repo>/releases/download/<version>/<asset>"
            tools_dir=/root/.cache/tauri
            mkdir -p "$tools_dir"
            seed_tool() {
              name="$1"; shift
              target="$tools_dir/$name"
              if [ -s "$target" ]; then
                return 0
              fi
              for url in "$@"; do
                rm -f "$target.part"
                if curl -fsSL --retry 2 --connect-timeout 8 -o "$target.part" "$url"; then
                  mv "$target.part" "$target"
                  chmod +x "$target"
                  return 0
                fi
              done
              rm -f "$target.part"
              echo "预置打包工具失败：$name，交由 tauri 经镜像模板自行下载" >&2
              return 0
            }
            proxy1="https://ghfast.top/https://github.com"
            proxy2="https://ghproxy.link/https://github.com"
            seed_tool AppRun-x86_64 \
              "$proxy1/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64" \
              "$proxy2/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64" \
              "https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64"
            seed_tool linuxdeploy-x86_64.AppImage \
              "$proxy1/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-x86_64.AppImage" \
              "$proxy2/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-x86_64.AppImage" \
              "https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-x86_64.AppImage"
            seed_tool linuxdeploy-plugin-gtk.sh \
              "https://cdn.jsdelivr.net/gh/tauri-apps/linuxdeploy-plugin-gtk@master/linuxdeploy-plugin-gtk.sh" \
              "https://ghfast.top/https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh" \
              "https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh"
            seed_tool linuxdeploy-plugin-gstreamer.sh \
              "https://cdn.jsdelivr.net/gh/tauri-apps/linuxdeploy-plugin-gstreamer@master/linuxdeploy-plugin-gstreamer.sh" \
              "https://ghfast.top/https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gstreamer/master/linuxdeploy-plugin-gstreamer.sh" \
              "https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gstreamer/master/linuxdeploy-plugin-gstreamer.sh"
            if ! seed_tool linuxdeploy-plugin-appimage.AppImage \
              "$proxy1/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage" \
              "$proxy2/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage" \
              "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage"; then
              echo "linuxdeploy-plugin-appimage 预置失败，tauri 将回退到内置版本"
            fi
            npm run tauri:build:linux
            version="$(node scripts/updater-release.mjs workspace-version --cargo-manifest Cargo.toml)"
            node scripts/updater-release.mjs stage \
              --build linux-x64 \
              --bundle-directory target/release/bundle \
              --output-directory release-assets \
              --version "$version"
        - name: 扫描发布资产中的凭据
          script: |
            set -e
            for artifact in release-assets/*; do
              pwsh -File scripts/assert-release-secret-free.ps1 -ArtifactPath "$artifact"
            done
        - name: 上传 Linux 安装包附件
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./release-assets/*"
